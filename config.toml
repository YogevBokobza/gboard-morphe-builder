enable-module-update = false
parallel-jobs = 1

# Builds Gboard patched with jasonwu1994/Gboard-patches (Morphe).
# Options: see CONFIG.md.

[Gboard]
patches-source = "jasonwu1994/Gboard-patches"
rv-brand = "Patches"
build-mode = "apk"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/gboard"
# 'auto' = the Gboard version the patches declare as compatible.
version = "auto"
